<style>
.m{font-family:'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace} .s{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:900;letter-spacing:4px}
.ga{animation:ga 3s steps(1) infinite} .gb{animation:gb 3s steps(1) infinite}
@keyframes ga{0%,88%,100%{transform:translate(0,0);opacity:0}89%{transform:translate(-6px,2px);opacity:.9}92%{transform:translate(5px,-2px);opacity:.9}95%{transform:translate(-3px,0);opacity:.9}}
@keyframes gb{0%,88%,100%{transform:translate(0,0);opacity:0}89%{transform:translate(6px,-2px);opacity:.9}92%{transform:translate(-5px,2px);opacity:.9}95%{transform:translate(3px,1px);opacity:.9}}
.flick{animation:fl 5s infinite} @keyframes fl{0%,19%,22%,62%,64%,100%{opacity:1}20%,21%,63%{opacity:.35}}
.cur{animation:bl 1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.pul{animation:pu 1.6s ease-in-out infinite} @keyframes pu{0%,100%{opacity:.3}50%{opacity:1}}
.hl{animation:mv 1.2s linear infinite} @keyframes mv{from{transform:translateY(0)}to{transform:translateY(16px)}}
.sc{animation:sc 8s linear infinite} @keyframes sc{from{transform:translateY(0)}to{transform:translateY(40px)}}
.node rect{fill:#0B0718;stroke-width:2} .node text{font-size:15px;fill:#F2F6FF;text-anchor:middle;font-family:'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace}
.spin1{animation:dsh 6s linear infinite} .spin2{animation:dsh 9s linear infinite reverse} @keyframes dsh{to{stroke-dashoffset:-200}}
.pul2{animation:pu 2s ease-in-out infinite}
</style>
