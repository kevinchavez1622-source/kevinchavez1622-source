<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1A2430" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="0.12" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#F5B547" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F5B547" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#4FE3C1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4FE3C1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FE3C1"/>
      <stop offset="1" stop-color="#7AA2FF"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="338" rx="18"/></clipPath>
    <style>
      .t{font-family:'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace}
      .h{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:2px}
      .node rect{fill:#0F151C;stroke-width:1.5}
      .node text{font-size:15px;fill:#E6EDF3;text-anchor:middle}
      .wire{fill:none;stroke:#3A4A5C;stroke-width:1.5}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0A0E13"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glowA)"/>
    <rect width="1200" height="340" fill="url(#glowB)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#1E2833" stroke-width="1.5"/>

  <!-- title -->
  <text class="t" x="64" y="70" font-size="14" fill="#8B98A5">~/kevin-chavez $ cat perfil.txt</text>
  <text class="h" x="60" y="160" font-size="76" fill="#E6EDF3">KEVIN</text>
  <text class="h" x="60" y="240" font-size="76" fill="url(#name)">CHÁVEZ</text>
  <text class="t" x="64" y="288" font-size="18" fill="#4FE3C1">&gt; sistemas · automatización · agentes IA<tspan class="cursor" fill="#4FE3C1"> ▍</tspan></text>

  <!-- wires -->
  <path id="w1" class="wire" d="M770 92 C 820 92, 800 170, 850 170"/>
  <path id="w2" class="wire" d="M930 170 C 970 170, 960 92, 1010 92"/>
  <path id="w3" class="wire" d="M930 170 C 975 170, 965 250, 1010 250"/>
  <path id="w4" class="wire" d="M1080 115 C 1080 150, 1080 200, 1080 228"/>

  <!-- moving packets -->
  <circle r="4.5" fill="#F5B547"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath xlink:href="#w1"/></animateMotion></circle>
  <circle r="4.5" fill="#4FE3C1"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath xlink:href="#w2"/></animateMotion></circle>
  <circle r="4.5" fill="#7AA2FF"><animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#w3"/></animateMotion></circle>
  <circle r="4.5" fill="#4FE3C1"><animateMotion dur="2s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#w4"/></animateMotion></circle>

  <!-- nodes -->
  <g class="node t"><rect x="660" y="70" width="110" height="44" rx="10" stroke="#F5B547"/><text x="715" y="97">whatsapp</text></g>
  <g class="node t"><rect x="850" y="148" width="80" height="44" rx="10" stroke="#4FE3C1"/><text x="890" y="175">n8n</text></g>
  <g class="node t"><rect x="1010" y="70" width="140" height="44" rx="10" stroke="#4FE3C1"/><text x="1080" y="97">llm · intent</text></g>
  <g class="node t"><rect x="1010" y="228" width="140" height="44" rx="10" stroke="#7AA2FF"/><text x="1080" y="255">hubspot</text></g>
  <g class="node t"><rect x="790" y="250" width="110" height="36" rx="10" stroke="#3A4A5C" stroke-dasharray="4 4"/><text x="845" y="273" style="font-size:13px;fill:#9AA8B6">pinecone</text></g>
  <path class="wire" d="M890 192 L 860 250" stroke-dasharray="4 4"/>

  <!-- status -->
  <circle class="pulse" cx="1092" cy="306" r="5" fill="#4FE3C1"/>
  <text class="t" x="1106" y="311" font-size="13" fill="#9AA8B6">online</text>
</svg>
